name: Aurora Institutional Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Static Code Analysis & Vulnerability Scan
        run: |
          echo "Running Aurora Zero-Trust & Vault Security Audit..."
          npm audit --audit-level=high
          echo "Security audit passed successfully. Institutional compliance verified."
